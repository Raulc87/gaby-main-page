name: Frontend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  # tests/e2e/** (GK-004-integration-e2e): Playwright against the real
  # Flask backend in LEADS_STORAGE=memory mode (LEAD_API_CONTRACT.md
  # section 10, SPRINT_001.md). Required — not allowed to fail
  # (US-012 AC4).
  e2e:
    runs-on: ubuntu-latest
    env:
      LEADS_STORAGE: memory
      PRIVACY_NOTICE_VERSION: e2e-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: api
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Start backend (memory storage, no real credentials)
        run: |
          python api/run_local.py &
          ready=false
          for i in $(seq 1 20); do
            # No -f: any HTTP response (even 422 from an empty body) means
            # the server is up; only a connection failure keeps the loop going.
            if curl -s -o /dev/null http://127.0.0.1:5000/api/save-lead -X POST \
                -H "Content-Type: application/json" -d '{}'; then
              ready=true
              break
            fi
            sleep 0.5
          done
          if [ "$ready" != true ]; then
            echo "Backend did not become ready within 10s" >&2
            exit 1
          fi

      - name: Run Playwright end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
