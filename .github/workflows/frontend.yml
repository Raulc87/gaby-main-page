name: Frontend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  # tests/e2e/** does not exist yet (it lands with Agent 2's integration PR,
  # GK-004-integration-e2e), so `npm run test:e2e` currently has nothing to
  # run. This job is intentionally allowed to fail (or no-op) until that PR
  # lands and wires up the real Playwright suite (LEAD_API_CONTRACT.md
  # section 10, SPRINT_001.md). Once it does, remove `continue-on-error`
  # here and make this job required in branch protection (US-012 AC4).
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      LEADS_STORAGE: memory
      PRIVACY_NOTICE_VERSION: e2e-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: api
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Start backend (memory storage, no real credentials)
        run: |
          python api/run_local.py &
          ready=false
          for i in $(seq 1 20); do
            # No -f: any HTTP response (even 422 from an empty body) means
            # the server is up; only a connection failure keeps the loop going.
            if curl -s -o /dev/null http://127.0.0.1:5000/api/save-lead -X POST \
                -H "Content-Type: application/json" -d '{}'; then
              ready=true
              break
            fi
            sleep 0.5
          done
          if [ "$ready" != true ]; then
            echo "Backend did not become ready within 10s" >&2
            exit 1
          fi

      - name: Run Playwright end-to-end tests
        run: |
          # tests/e2e/** lands with Agent 2's GK-004-integration-e2e. Until
          # then there are no specs to run, so soft-skip instead of letting
          # Playwright's "No tests found" report as a check-run failure
          # (job-level continue-on-error only protects the workflow run's
          # overall conclusion, not this job's own check-run status).
          if find tests/e2e -name '*.spec.ts' 2>/dev/null | grep -q .; then
            npm run test:e2e
          else
            echo "No e2e specs yet (lands with GK-004-integration-e2e) — skipping."
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
