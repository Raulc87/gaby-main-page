name: Backend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      # US-013 / ADR-004: disabled so pytest is never affected by the
      # rate limiter; rate-limit tests install their own RateLimiter.
      RATE_LIMIT_MAX_REQUESTS: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: pytest
